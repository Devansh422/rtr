<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#FF9933" />
        <meta
            name="description"
            content="#RightToRecall is a non-partisan civic movement calling on all State Governments and the Government of India to enact a comprehensive Right to Recall Law. One nation, one demand."
        />
        <meta
            name="keywords"
            content="Right to Recall, civic movement, democratic accountability, India, voter power, transparency, civic participation"
        />
        <meta name="author" content="RightToRecall Movement" />

        <!--
        SET YOUR DOMAIN BEFORE LAUNCH.
        Replace https://righttorecall.org below with your real domain. The same
        placeholder appears in public/robots.txt and public/sitemap.xml, so a
        find-and-replace across those three files is all that is needed.
        Absolute URLs are required here: social crawlers do not resolve relative
        paths, so a wrong domain is worse than none.
        -->
        <link rel="canonical" href="https://righttorecall.org/" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="#RightToRecall Movement" />
        <meta property="og:title" content="India deserves accountability. Bring Right to Recall." />
        <meta
            property="og:description"
            content="A hopeful, non-partisan civic movement giving citizens the power to stay engaged with democracy, every day, not just on election day."
        />
        <meta property="og:url" content="https://righttorecall.org/" />
        <meta property="og:image" content="https://righttorecall.org/logo.png" />
        <meta property="og:image:alt" content="Right to Recall Movement logo" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="India deserves accountability. Bring Right to Recall." />
        <meta
            name="twitter:description"
            content="Join the non-partisan #RightToRecall movement for democratic accountability."
        />
        <meta name="twitter:image" content="https://righttorecall.org/logo.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="icon" href="%PUBLIC_URL%/logo.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />

        <title>#RightToRecall Movement | India Deserves Accountability</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
