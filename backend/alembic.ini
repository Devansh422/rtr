# Alembic configuration for the relational (Postgres) side of the backend.
#
# The database URL is NOT stored here -- env.py reads DATABASE_URL from the
# environment so a connection string with credentials never enters the repo.
#
#   cd backend && alembic upgrade head
#   cd backend && alembic revision --autogenerate -m "add representatives"

[alembic]
script_location = migrations
prepend_sys_path = ..
version_path_separator = os

# Timestamped, readable revision filenames rather than bare hashes -- with
# several contributors adding modules, "when was this added" needs to be legible
# from the directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
